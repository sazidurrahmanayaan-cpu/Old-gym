# Netlify Build and Routing Configuration for Old Gym Munshiganj (Vite React SPA)

[build]
  # Build command to compile Vite frontend
  command = "npm run build"
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Ensures all route paths (e.g. /admin, /pricing) are served by /index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers for high performance and frame support
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
